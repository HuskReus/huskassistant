<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HuskAssistant">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230d1421'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23ffb03a' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%234fd6c9'/%3E%3C/svg%3E">
<title>HuskAssistant</title>
<style>
  :root{
    --bg:#0d1421; --panel:#151f33; --panel2:#1b2740;
    --ink:#e8edf7; --muted:#8593ad;
    --amber:#ffb03a; --teal:#4fd6c9;
    --line:rgba(255,255,255,.07);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }

  /* ---- status bar (la firma: punto vivo con barrido de radar) ---- */
  header{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel),transparent);
    flex-shrink:0;
  }
  .beacon{position:relative;width:12px;height:12px;flex-shrink:0}
  .beacon .core{position:absolute;inset:3px;border-radius:50%;background:var(--teal)}
  .beacon .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--amber);opacity:.9;
    animation:sweep 2.4s ease-out infinite}
  @keyframes sweep{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
  .title{font-family:var(--mono);font-size:13px;letter-spacing:.14em;font-weight:600}
  .state{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
  .state.err{color:var(--amber)}

  /* ---- stream ---- */
  main{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;
    -webkit-overflow-scrolling:touch}
  .msg{max-width:82%;padding:11px 14px;line-height:1.45;font-size:15px;word-wrap:break-word;white-space:pre-wrap}
  .msg.agent{align-self:flex-start;background:var(--panel);border-left:2px solid var(--amber);
    border-radius:4px 14px 14px 14px}
  .msg.user{align-self:flex-end;background:var(--panel2);color:#eafcfa;
    border-right:2px solid var(--teal);border-radius:14px 4px 14px 14px}
  .msg.sys{align-self:center;font-family:var(--mono);font-size:11px;color:var(--muted);
    letter-spacing:.06em;background:none;padding:2px}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.5;align-self:flex-start;max-width:88%}

  /* ---- composer ---- */
  footer{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-top:1px solid var(--line);background:linear-gradient(0deg,var(--panel),transparent)}
  #input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:16px;padding:12px 14px;border-radius:12px;outline:none}
  #input:focus{border-color:var(--teal)}
  #input::placeholder{color:var(--muted)}
  button{border:none;cursor:pointer;background:none;color:var(--ink);font-family:var(--sans)}
  .btn{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
    transition:transform .08s}
  .btn:active{transform:scale(.92)}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  #mic{background:var(--panel2);border:1px solid var(--line)}
  #mic.listening{background:rgba(255,176,58,.16);border-color:var(--amber);
    animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,176,58,.4)}50%{box-shadow:0 0 0 8px rgba(255,176,58,0)}}
  #send{background:var(--amber);color:#0d1421}
  svg{width:22px;height:22px}

  @media(prefers-reduced-motion:reduce){
    .beacon .ring,#mic.listening{animation:none}
  }
</style>
</head>
<body>
  <header>
    <div class="beacon"><div class="ring"></div><div class="core"></div></div>
    <div class="title">HUSKASSISTANT</div>
    <div class="state" id="state">conectando…</div>
  </header>

  <main id="stream">
    <div class="msg agent">Consola lista. Pregúntame el estado del radar, del bot de Polymarket, o ponme un recordatorio.</div>
    <div class="hint">Prueba: "¿cómo va el radar?" · "recuérdame revisar posiciones a las 9pm" · o toca el micrófono y habla.</div>
  </main>

  <footer>
    <button id="mic" class="btn" aria-label="Hablar" title="Hablar">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </button>
    <input id="input" placeholder="Escribe o habla…" autocomplete="off" enterkeyhint="send">
    <button id="send" class="btn" aria-label="Enviar" title="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d1421" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12l16-8-6 16-3-6-7-2z"/>
      </svg>
    </button>
  </footer>

<script>
(function(){
  const API = "";                 // mismo origen que sirve esta página
  const stream = document.getElementById("stream");
  const input  = document.getElementById("input");
  const state  = document.getElementById("state");
  const micBtn = document.getElementById("mic");

  // id de dispositivo estable (por si quieres separar historial por celular)
  let chatId = "pwa";
  try{
    chatId = localStorage.getItem("huskassistant_id")
      || (crypto.randomUUID?.() || "pwa-"+Date.now());
    localStorage.setItem("huskassistant_id", chatId);
  }catch(e){/* modo privado: usamos el default */}

  function bubble(text, cls){
    const el=document.createElement("div");
    el.className="msg "+cls; el.textContent=text;
    stream.appendChild(el); stream.scrollTop=stream.scrollHeight;
    return el;
  }

  async function send(text){
    text=(text||"").trim(); if(!text) return;
    bubble(text,"user"); input.value="";
    const thinking=bubble("…","sys");
    try{
      const r=await fetch(API+"/api/message",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({chat_id:chatId,text})
      });
      const data=await r.json();
      thinking.remove();
      bubble(data.reply||"(sin respuesta)","agent");
      state.textContent="en línea"; state.classList.remove("err");
    }catch(err){
      thinking.remove();
      bubble("Sin conexión con el cerebro. Revisa que el VPS y api.py estén arriba.","agent");
      state.textContent="sin cerebro"; state.classList.add("err");
    }
  }

  document.getElementById("send").onclick=()=>send(input.value);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") send(input.value); });

  // ---- voz: reconocimiento nativo del navegador ----
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    const rec=new SR(); rec.lang="es-ES"; rec.interimResults=false; rec.maxAlternatives=1;
    let on=false;
    micBtn.onclick=()=>{ on?rec.stop():rec.start(); };
    rec.onstart =()=>{on=true; micBtn.classList.add("listening"); input.placeholder="Escuchando…";};
    rec.onend   =()=>{on=false; micBtn.classList.remove("listening"); input.placeholder="Escribe o habla…";};
    rec.onerror =()=>{on=false; micBtn.classList.remove("listening");};
    rec.onresult=e=>{ const t=e.results[0][0].transcript; input.value=t; send(t); };
  }else{
    // iOS Safari suele no traer esta API: dejamos el micro para dictado del teclado.
    micBtn.onclick=()=>{ input.focus();
      bubble("Este navegador no trae reconocimiento de voz. Usa el micrófono del teclado.","sys"); };
  }

  // ping inicial de estado
  fetch(API+"/manifest.json").then(()=>state.textContent="en línea")
    .catch(()=>{state.textContent="sin cerebro";state.classList.add("err");});
})();
</script>
</body>
</html>
